name: Bootstrap Rust formatting

on:
  push:
    branches:
      - feat/rust-shield24-foundation

permissions:
  contents: write

concurrency:
  group: rust-foundation-bootstrap
  cancel-in-progress: true

jobs:
  format-and-lock:
    if: github.repository == 'Lalalalendia/bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rust-shield24-foundation
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate deterministic source formatting and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Commit formatting and Cargo.lock only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src Cargo.lock
          if git diff --cached --quiet; then
            echo "Rust formatting and lockfile already committed."
            exit 0
          fi
          git commit -m "style: apply rustfmt and pin Cargo dependencies"
          git push origin HEAD:refs/heads/feat/rust-shield24-foundation

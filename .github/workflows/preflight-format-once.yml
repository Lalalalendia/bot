name: One-time Rust preflight formatting

on:
  push:
    branches: [feat/rust-shield24-foundation]

permissions:
  contents: write

concurrency:
  group: rebuild-preflight-formatting
  cancel-in-progress: true

jobs:
  check-and-format:
    if: github.repository == 'Lalalalendia/bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rust-shield24-foundation
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Save only tested rustfmt changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "style: format and validate Telegram preflight"
          git push origin HEAD:refs/heads/feat/rust-shield24-foundation

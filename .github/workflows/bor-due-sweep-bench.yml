name: BOR due-sweep benchmark
on:
  pull_request:
    paths:
      - "src/store.rs"
      - "src/bot.rs"
      - ".github/workflows/bor-due-sweep-bench.yml"
permissions:
  contents: read
jobs:
  benchmark:
    if: github.event.pull_request.head.ref == 'exp/bor-due-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compare legacy and indexed due-only maintenance
        run: cargo test --release --locked bench_due_sweep_against_legacy -- --ignored --nocapture
